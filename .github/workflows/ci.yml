name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    # Windows only for now; macOS and Linux return after the Windows build is solid.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo xtask ci
